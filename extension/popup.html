<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Justo CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Funnel Sans', -apple-system, sans-serif; }
    body { width: 280px; padding: 20px; background: #0E0F10; color: #fff; }
    .logo { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .logo span { color: #F05B17; }
    .sub { font-size: 12px; color: #9CA3AF; margin-bottom: 18px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #9CA3AF; margin-bottom: 4px; margin-top: 12px; }
    input { width: 100%; padding: 9px 10px; border-radius: 7px; border: 1.5px solid #252B35; background: #181C22; color: #fff; font-size: 13px; outline: none; }
    input:focus { border-color: #F05B17; }
    button { width: 100%; margin-top: 18px; padding: 10px; border-radius: 8px; border: none; background: #F05B17; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { margin-top: 10px; font-size: 12px; color: #F87171; }
    .logged-in { text-align: center; }
    .logged-in .email { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    .logged-in .hint { font-size: 11px; color: #9CA3AF; margin-bottom: 16px; }
    .logout { background: #181C22; border: 1px solid #252B35; }
  </style>
</head>
<body>
  <div class="logo">Justo <span>CRM</span></div>
  <div class="sub">Prospecção via WhatsApp</div>

  <div id="loginForm">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" />
    <label>Senha</label>
    <input type="password" id="password" placeholder="••••••••" />
    <button id="loginBtn">Entrar</button>
    <div class="error" id="error"></div>
  </div>

  <div id="loggedIn" class="logged-in" style="display:none">
    <div style="font-size: 28px; margin-top: 8px;">✅</div>
    <div class="email" id="userEmail"></div>
    <div class="hint">Abra o WhatsApp Web para usar o painel</div>
    <button class="logout" id="logoutBtn">Sair</button>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
